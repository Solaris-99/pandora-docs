<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Core Theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" />
  </head>
  <body class="loading sidebar-chevron-left sidebar-group-underline">
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script>
      function enableMermaidZoom() {
        document.querySelectorAll(".mermaid svg").forEach((svg) => {
          if (svg.dataset.zoomEnabled) return;
          svg.dataset.zoomEnabled = "true";

          svgPanZoom(svg, {
            zoomEnabled: true,
            controlIconsEnabled: true,
            fit: true,
            center: true,
            minZoom: 0.5,
            maxZoom: 10
          });
        });
      }

      // Run after Docsify/Mermaid renders, and again after Docsify page changes.
      window.addEventListener("load", enableMermaidZoom);
      window.$docsify = window.$docsify || {};
      window.$docsify.plugins = [
        ...(window.$docsify.plugins || []),
        (hook) => {
          hook.doneEach(enableMermaidZoom);
        }
      ];
    </script>

    <!-- Configuration -->
    <script>
      // Merge instead of reassigning, so plugins registered above (mermaid zoom) are kept.
      window.$docsify = Object.assign(window.$docsify || {}, {
        loadSidebar: true,
        subMaxLevel: 2,
        relativePath: true,
        auto2top: true,
        autoHeader: true,
        search: {
          placeholder: "Buscar...",
          // Explicit list: with nested _sidebar.md files, "auto" only indexes the sidebar currently loaded.
          paths: [
            "/",
            "/requerimientos",
            "/trazabilidad",
            "/clases-dominio",
            "/modelo-tablas",
            "/clases-diseno",
            "/diseno-componentes",
            "/diseno-arquitectura",
            "/interfaces-entre-sistemas",
            "/casos-de-prueba",
            "/DESIGN",
            "/battle-formula",
            "/casos-de-uso/",
            "/casos-de-uso/actores",
            "/casos-de-uso/flujo-moderacion",
            ...[
              "cu01-registrarse",
              "cu02-verificar-email",
              "cu03-login",
              "cu04-recuperar-contrasena-olvidada",
              "cu05-limpieza-de-cuentas-no-verificadas",
              "cu06-ver-editar-perfil",
              "cu07-cambiar-email",
              "cu08-cambiar-contrasena",
              "cu09-subir-obra",
              "cu10-editar-obra",
              "cu11-eliminar-obra",
              "cu12-explorar-obras",
              "cu13-comentar-obra",
              "cu14-calificar-obra-mediante-q2q",
              "cu15-conversion-de-obra-a-carta",
              "cu16-explorar-coleccion-cartas",
              "cu17-abrir-paquete",
              "cu18-jugar-autobattler",
              "cu19-seguir-usuario",
              "cu20-destacar-obra-o-carta",
              "cu21-denunciar-obra",
              "cu22-denunciar-comentario",
              "cu23-administrar-denuncias",
              "cu24-notificaciones",
              "cu25-gestionar-rol-de-moderador",
              "cu26-reabrir-un-reporte-resuelto",
              "cu27-apelar-una-sancion",
              "cu28-revisar-una-apelacion",
              "cu29-cargar-carta-directamente",
              "cu30-disparar-el-ciclo-de-conversion-manualmente"
            ].map((p) => "/casos-de-uso/" + p)
          ]
        }
      });
    </script>

    <!-- Docsify.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- Plugins (optional) -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
      mermaid.initialize({ startOnLoad: true });
      window.mermaid = mermaid;
    </script>
    <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
    <style>
      svg {
        min-height: 500px;
      }
    </style>
  </body>
</html>
